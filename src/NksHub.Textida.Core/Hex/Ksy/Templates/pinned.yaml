# The structure templates that ship with Textida (P8.10.5).
# file: the .ksy file in this folder. version: the pinned copy. source: where the file comes from. license: the licence it ships under (CC0-1.0, MIT or a BSD licence only).
# constructs: what the file uses, named as in KsyParser.Constructs; a test compares this list with what the parser finds in the file.
# Every file here was written for Textida from the public description of the format and is MIT like the rest of the repository; no .ksy file of another project is copied.
- file: bmp.ksy
  version: 1
  license: MIT
  source: "Textida repository; written from the BITMAPFILEHEADER and BITMAPINFOHEADER description"
  constructs: [bytes, contents, enum, enums, expr, instances.value, int, meta, meta.endian, meta.file-extension, seq, size, types, user-type]
- file: png.ksy
  version: 1
  license: MIT
  source: "Textida repository; written from the PNG specification (chunk layout)"
  constructs: [contents, enum, enums.nested, expr, expr.float, instances.value, int, meta, meta.endian, meta.file-extension, repeat.eos, seq, size, size-eos, str, strz, switch-on, types, user-type]
- file: zip.ksy
  version: 1
  license: MIT
  source: "Textida repository; written from the PKWARE APPNOTE"
  constructs: [bits, bytes, contents, enum, enums.nested, expr, expr.enum, int, meta, meta.bit-endian, meta.encoding, meta.endian, meta.file-extension, repeat.eos, seq, size, size-eos, str, switch-on, types, user-type]
- file: pe.ksy
  version: 1
  license: MIT
  source: "Textida repository; written from Microsoft's PE format description"
  constructs: [bits, bytes, contents, enum, enums.nested, expr, expr.enum, if, instances.pos, int, meta, meta.bit-endian, meta.encoding, meta.endian, meta.file-extension, repeat.expr, seq, size, str, switch-on, types, user-type]
- file: elf.ksy
  version: 1
  license: MIT
  source: "Textida repository; written from the System V gABI ELF chapter"
  constructs: [bytes, contents, enum, enums, enums.nested, expr, expr.enum, if, instances.io, instances.pos, int, meta, meta.encoding, meta.endian-switch, meta.file-extension, repeat.expr, repeat.until, seq, size, switch-on, types, user-type]
- file: stl.ksy
  version: 1
  license: MIT
  source: "Textida repository; written from the description of the binary STL format"
  constructs: [bytes, expr, float, int, meta, meta.endian, meta.file-extension, repeat.expr, seq, size, types, user-type]
