[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textida-plugin"
version = "0.1.0"
description = "SDK for Textida plugins written in Python: the plugin protocol and the calls of the document API, with types."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["textida_plugin"]
